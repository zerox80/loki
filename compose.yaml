name: loki-vpn

# Consumed by tools/compose.py; TUN/NAT are prepared on the host.
x-loki-host:
  wan_iface: "${LOKI_WAN_IFACE:?Set LOKI_WAN_IFACE in .env to your Internet interface}"

services:
  server:
    image: "${LOKI_IMAGE:-loki-vpn:local}"
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    network_mode: host
    userns_mode: host
    user: "${LOKI_UID:-1000}:${LOKI_GID:-1000}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    init: true
    restart: unless-stopped
    stop_grace_period: 5s
    pids_limit: 32
    devices:
      - /dev/net/tun:/dev/net/tun:rw
    volumes:
      - type: bind
        source: "${LOKI_KEYS_DIR:?Set LOKI_KEYS_DIR to the directory with the three server credentials}"
        target: /run/cvpn/keys
        read_only: true
        bind:
          create_host_path: false
    command:
      - server
      - --endpoint
      - "${LOKI_BIND_ADDRESS:-0.0.0.0}"
      - --port
      - "${LOKI_PORT:-4433}"
      - --tun
      - "${LOKI_TUN:-cvpn0}"
      - --mtu
      - "${LOKI_MTU:-1280}"
      - --local-ip
      - "${LOKI_LOCAL_IP:-10.203.0.1}"
      - --peer-ip
      - "${LOKI_PEER_IP:-10.203.0.2}"
      - --cert
      - /run/cvpn/keys/server.pem
      - --key
      - /run/cvpn/keys/server.key
      - --ca
      - /run/cvpn/keys/ca.pem
      - --peer-name
      - "${LOKI_PEER_NAME:-client.cvpn}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
